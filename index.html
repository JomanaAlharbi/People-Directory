<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <title>people Directory</title>
</head>

<body>
  <h2>people Directory</h2>
  <form id="userForm">
    <label for="name">name:</label>
    <input type="text" id="name" placeholder="الاسم">
    <label for="age">age:</label>
    <input type="number" id="age" placeholder="العمر">
    <button type="submit">Submit</button>
  </form>
  <table id="People table" border="1">
    <thead>
      <style>
        #userForm {
          margin-bottom: 30px;
        }
      </style>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <body id="tableBody">

    </body>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://bkzjaukwgjmhsvlorffp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xZtZzFEU_Zx5jMel_Us6bA_wFn0j6VO";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("userForm");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;

      const { data, error } = await client
        .from("users")
        .insert([{ name: name, age: age, status: 0 }]);

      if (error) {
        console.log("خطأ:", error.message);
      } else {
        console.log("تمت الإضافة بنجاح");
        form.reset();
      }
    });
  </script>
</body>

</html>
